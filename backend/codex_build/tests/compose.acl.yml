services:
  neo4j:
    image: neo4j:5.18.0
    environment:
      NEO4J_AUTH: neo4j/acl-test-password
      NEO4J_initial_dbms_default__database: neo4j-test
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -u neo4j -p acl-test-password 'RETURN 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  test-runner:
    build:
      context: ..
    working_dir: /app
    volumes:
      - ..:/app:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: acl-test-password
      NEO4J_TEST_URI: bolt://neo4j:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: acl-test-password
      TEST_NEO4J_DATABASE: neo4j-test
      TESTING: 'true'
      LOAD_DEMO_DATA: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
      neo4j:
        condition: service_healthy
    command: [sh, -c, "pip install -q pytest && python -m pytest -p no:cacheprovider tests/test_acl_integration.py tests/test_language_catalog.py -q"]
