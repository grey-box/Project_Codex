services:
  # Disposable Neo4j instance for the pytest suite — separate from the `neo4j`
  # service above so tests never read or write dev data. Same image/APOC
  # config as the dev instance so behavior matches; different ports and a
  # separate volume so the two never collide.
  neo4j-test:
    image: neo4j:5.18.0
    container_name: codex-neo4j-test-search
    environment:
      NEO4J_AUTH: "neo4j/changeme"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7475:7474" # Neo4j Browser (test) → http://localhost:7475
      - "7688:7687" # Bolt (test) — used by pytest
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p changeme 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Disposable test runner — fresh dependency install per build (not per
  # run, via the image layer cache), so it can't be fooled by a stale
  # image the way `docker exec`-ing into the long-running api container
  # could be. Source is mounted as a volume so editing a test file doesn't
  # require a rebuild; only a requirements.txt change does.
  test-runner:
    build:
      context: ./backend/codex_build
      dockerfile: tests/Dockerfile
    container_name: codex-test-runner-search
    working_dir: /app
    volumes:
      - ./backend/codex_build:/app
    environment:
      - NEO4J_URI=bolt://neo4j-test:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changeme
    depends_on:
      neo4j-test:
        condition: service_healthy

volumes:
  neo4j_test_data:
